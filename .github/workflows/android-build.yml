name: Android CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (retry transient repository rate limits)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            gradle --no-daemon assembleDebug 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -Eqi '429|Too Many Requests|Could not GET|Read timed out|Connection reset' build.log; then
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient dependency repository error; retrying in $((attempt * 20)) seconds (attempt $((attempt + 1))/3)."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vivocam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
